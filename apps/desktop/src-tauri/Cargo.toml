[package]
name = "assemblex-studio"
version = "0.1.0"
description = "AssembleX Studio — AI 硬體開發工作站"
edition = "2021"
rust-version = "1.77"

[lib]
name = "assemblex_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
