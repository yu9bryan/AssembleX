name: AssembleX
options:
  bundleIdPrefix: yu8bryan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  AssembleX:
    type: application
    platform: iOS
    sources:
      - path: AssembleX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yu8bryan.AssembleX
        PRODUCT_NAME: AssembleX
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AssembleX
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_FILE: AssembleX/Info.plist
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "找到同一個 Wi-Fi 上的 AssembleX Studio"
        INFOPLIST_KEY_NSCameraUsageDescription: "AssembleX 用相機辨識麵包板並標出每個孔位。"
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UNU747VFGT
